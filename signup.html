<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Pawfect Academy</title>
  <meta name="description" content="Create your Pawfect Academy account to enroll in training programs, track your dog's progress and connect with expert trainers." />
  <!-- Favicon & Brand Icons -->
  <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/images/apple-touch-icon.png" />
  <meta name="theme-color" content="#D97745" />
  <link rel="stylesheet" href="./assets/css/global.css" />
  <link rel="stylesheet" href="./assets/css/auth.css" />
</head>
<body class="auth-body">

  <main class="auth-card auth-card-wide" aria-labelledby="signupHeading">
    <div class="auth-brand">
      <a href="./index.html" class="navbar-logo" aria-label="Pawfect Academy — Home">
        <span class="navbar-logo-icon" aria-hidden="true">
          <svg class="icon icon-md" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="7" cy="8.5" r="2"/><circle cx="17" cy="8.5" r="2"/><circle cx="10" cy="5" r="2"/><circle cx="14" cy="5" r="2"/><path d="M12 11c-2.8 0-5 2-5 4.5 0 2 1.6 3.5 3.5 3.5.8 0 1.2-.4 1.5-.7.3.3.7.7 1.5.7 1.9 0 3.5-1.5 3.5-3.5 0-2.5-2.2-4.5-5-4.5z"/></svg>
        </span>
        <div>
          <div class="navbar-logo-text">Pawfect <span>Academy</span></div>
          <div class="navbar-logo-sub">Dog Training School</div>
        </div>
      </a>
    </div>

    <div class="auth-heading">
      <h1 id="signupHeading">Create Account</h1>
      <p>Create an account to get started.</p>
    </div>

    <form id="signupForm" data-auth-form novalidate>
      <div class="form-group">
        <label class="form-label" for="signupName">Full Name</label>
        <input type="text" id="signupName" name="name" class="form-control" placeholder="Jane Smith" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label class="form-label" for="signupEmail">Email Address</label>
        <input type="email" id="signupEmail" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label class="form-label" for="signupPhone">Phone Number</label>
        <input type="tel" id="signupPhone" name="phone" class="form-control" placeholder="(555) 123-4567" required autocomplete="tel" />
      </div>

      <div class="form-group">
        <label class="form-label" for="signupPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="signupPassword" name="password" class="form-control" placeholder="Min. 8 characters" required autocomplete="new-password" data-minlength="8" />
          <button type="button" class="password-toggle" data-password-toggle="signupPassword" aria-label="Show password" aria-pressed="false">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signupConfirm">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="signupConfirm" name="confirm" class="form-control" placeholder="Repeat your password" required autocomplete="new-password" />
          <button type="button" class="password-toggle" data-password-toggle="signupConfirm" aria-label="Show password" aria-pressed="false">
            <svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label class="auth-check auth-terms" for="termsCheck">
          <input type="checkbox" id="termsCheck" name="terms" required />
          <span>I agree to the <a href="./terms-conditions.html">Terms &amp; Conditions</a> and <a href="./privacy-policy.html">Privacy Policy</a></span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg auth-submit">Create Account</button>
    </form>

    <div class="auth-divider" aria-hidden="true"><span>or sign up with</span></div>

    <div class="social-row">
      <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer" class="social-auth-btn" aria-label="Sign up with Google">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.25 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.25 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        <span>Google</span>
      </a>
      <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="social-auth-btn" aria-label="Sign up with Facebook">
        <svg viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047v-2.66c0-3.025 1.792-4.697 4.533-4.697 1.313 0 2.686.236 2.686.236v2.971H15.83c-1.491 0-1.956.93-1.956 1.886v2.264h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
        <span>Facebook</span>
      </a>
      <a href="https://www.apple.com/" target="_blank" rel="noopener noreferrer" class="social-auth-btn" aria-label="Sign up with Apple">
        <svg class="apple-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 5.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
        <span>Apple</span>
      </a>
    </div>

    <p class="auth-switch">Already have an account? <a href="./login.html">Sign In</a></p>
  </main>

  <script src="./assets/js/global.js"></script>
  <script src="./assets/js/auth.js"></script>
</body>
</html>
